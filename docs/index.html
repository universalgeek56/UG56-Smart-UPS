<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="./style.css">
  <title>Smart UPS</title>
</head>

<body>
  <div class="wrap">
    <h3>Smart UPS</h3>
    <div class="block state">
      UPS State: <b id="ups">?</b><br>
      UPS Mode: <b id="mode">?</b><br>
      Next Switch: <b id="next">--:--:--</b>
    </div>
    <div class="block state">
      Voltage: <b id="vin">--.-</b> V<br>
      Battery: <b id="bat">--%</b> <b id="dir">?</b><br>
      Status: <b id="pwr">?</b>
    </div>
    <div class="btn-block"><button id="on">ON</button></div>
    <div class="btn-block"><button id="off">OFF</button></div>
    <div class="btn-block"><button id="cyc">CYCLE</button></div>
    <div class="block">
      <div class="label">ON time (minutes)</div>
      <div class="row"><input type="range" min="1" max="120" id="onRange"><span id="onVal">--</span></div>
      <div class="label" style="margin-top:16px">OFF time (minutes)</div>
      <div class="row"><input type="range" min="1" max="120" id="offRange"><span id="offVal">--</span></div>
    </div>
    <div class="btn-block"><a href="./battery.html"><button>⚡ Battery</button></a></div>
    <div class="btn-block"><a href="./settings.html"><button>⚙️ Settings</button></a></div>
  </div>
  <script src="ups-sim.js"></script>
  <script src="footer.js"></script>
  <script>
    let userActive = false,
      releaseT, saveT;
    const setMode = m => fetch('/mode?m=' + m);

    function hms(s) {
      if (s < 0) return '--:--:--';
      let h = Math.floor(s / 3600),
        m = Math.floor((s % 3600) / 60),
        x = s % 60;
      return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0');
    }

    function userTouch() {
      userActive = true;
      clearTimeout(releaseT);
      releaseT = setTimeout(() => userActive = false, 1500);
    }

    function debounceSave() {
      clearTimeout(saveT);
      saveT = setTimeout(() => fetch(`/save?on=${onRange.value}&off=${offRange.value}`), 600);
    }
    onRange.oninput = _ => {
      onVal.textContent = onRange.value;
      userTouch();
      debounceSave();
    }
    offRange.oninput = _ => {
      offVal.textContent = offRange.value;
      userTouch();
      debounceSave();
    }

    function upd() {
      fetch('/status').then(r => r.json()).then(s => {
        ups.textContent = s.ups ? 'ON' : 'OFF';
        mode.textContent = s.mode;
        next.textContent = hms(s.next);
        if (!userActive) {
          onRange.value = s.on;
          onVal.textContent = s.on;
          offRange.value = s.off;
          offVal.textContent = s.off;
        }
        on.classList.toggle('active', s.mode === 'ON');
        off.classList.toggle('active', s.mode === 'OFF');
        cyc.classList.toggle('active', s.mode === 'CYCLE');
        vin.textContent = s.vin.toFixed(2);
        bat.textContent = s.bat + '%';
        dir.textContent = s.charging ? '↑ Charging' : '↓ Discharging';
        pwr.className = '';
        if (s.critical) {
          pwr.textContent = 'CRITICAL';
          pwr.classList.add('crit');
        } else if (s.low) {
          pwr.textContent = 'LOW';
          pwr.classList.add('low');
        } else {
          pwr.textContent = 'OK';
          pwr.classList.add('ok');
        }
      });
    }
    setTimeout(() => {
      upd();
      setInterval(upd, 1200);
    }, 800);
  </script>
</body>

</html>
